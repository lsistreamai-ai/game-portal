<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Ball Z - LSI Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { 
            background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #gameArea {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .bar-container {
            width: 45%;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .bar {
            height: 100%;
            transition: width 0.3s;
        }
        .health-bar { background: linear-gradient(90deg, #ff4444, #ff8800); }
        .energy-bar { background: linear-gradient(90deg, #4488ff, #00ffff); }
        .bar-label {
            position: absolute;
            font-family: monospace;
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            margin-left: 5px;
            margin-top: 2px;
        }
        #controls {
            background: rgba(0,0,0,0.7);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 3px;
        }
        .dpad-btn {
            background: linear-gradient(145deg, #444, #333);
            border: none;
            border-radius: 8px;
            color: #ff9900;
            font-size: 18px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .dpad-btn:active {
            background: #555;
            transform: scale(0.95);
        }
        .dpad-btn.empty { background: transparent; pointer-events: none; }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            touch-action: manipulation;
            text-shadow: 1px 1px 2px black;
        }
        .btn-attack {
            background: linear-gradient(145deg, #ff6600, #cc4400);
            color: white;
        }
        .btn-energy {
            background: linear-gradient(145deg, #00aaff, #0066cc);
            color: #00ffff;
        }
        .btn-special {
            background: linear-gradient(145deg, #ffcc00, #ff9900);
            color: #330000;
        }
        .action-btn:active { transform: scale(0.9); }
        
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        #overlay.hidden { display: none; }
        #overlay h1 {
            font-size: 2.5rem;
            color: #ff9900;
            text-shadow: 0 0 20px #ff6600, 2px 2px 4px black;
            margin-bottom: 10px;
            font-family: monospace;
        }
        #overlay h2 { color: #ffcc00; margin-bottom: 20px; }
        #overlay p { color: #aaa; margin-bottom: 30px; font-size: 1rem; }
        .btn {
            background: linear-gradient(145deg, #ff9900, #ff6600);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        #score-display {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }
        .stat-row {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .stat {
            text-align: center;
        }
        .stat-label { color: #888; font-size: 0.8rem; }
        .stat-value { color: #ffcc00; font-size: 1.5rem; font-weight: bold; }

        @media (max-width: 350px) {
            .dpad { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); }
            .action-btn { width: 60px; height: 60px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameArea">
            <canvas id="game"></canvas>
            <div id="hud">
                <div style="position: relative;">
                    <div class="bar-label">HP</div>
                    <div class="bar-container">
                        <div class="bar health-bar" id="healthBar" style="width: 100%"></div>
                    </div>
                </div>
                <div style="position: relative;">
                    <div class="bar-label">KI</div>
                    <div class="bar-container">
                        <div class="bar energy-bar" id="energyBar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
            <div id="score-display">SCORE: 0 | WAVE: 1</div>
        </div>
        
        <div id="controls">
            <div class="dpad">
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="up">▲</button>
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="left">◀</button>
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="right">▶</button>
                <div class="dpad-btn empty"></div>
                <button class="dpad-btn" id="down">▼</button>
                <div class="dpad-btn empty"></div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn btn-attack" id="attack">PUNCH</button>
                <button class="action-btn btn-energy" id="energy">KI<br>BLAST</button>
                <button class="action-btn btn-special" id="special">KAIO<br>KEN</button>
            </div>
        </div>
        
        <div id="overlay">
            <h1>⚡ DRAGON BALL Z ⚡</h1>
            <h2>Power Warriors</h2>
            <p>Defeat enemies with punches and Ki blasts!<br>Use Kaioken to power up!</p>
            <button class="btn" onclick="startGame()">FIGHT!</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            const area = document.getElementById('gameArea');
            width = area.clientWidth;
            height = area.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Game state
        let game = {
            running: false,
            score: 0,
            wave: 1,
            player: {
                x: 0, y: 0,
                vx: 0, vy: 0,
                health: 100,
                maxHealth: 100,
                energy: 100,
                maxEnergy: 100,
                powerLevel: 1,
                kaioken: false,
                kaiokenTimer: 0,
                attacking: false,
                attackTimer: 0,
                facing: 1
            },
            enemies: [],
            projectiles: [],
            particles: [],
            spawnTimer: 0
        };
        
        const GRAVITY = 0.5;
        const GROUND_Y = 0.85;
        
        // Input
        const keys = { left: false, right: false, up: false, down: false };
        
        function setupInput() {
            const btnIds = ['up', 'down', 'left', 'right'];
            btnIds.forEach(id => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', e => { e.preventDefault(); keys[id] = true; }, { passive: false });
                btn.addEventListener('touchend', e => { e.preventDefault(); keys[id] = false; }, { passive: false });
                btn.addEventListener('mousedown', () => keys[id] = true);
                btn.addEventListener('mouseup', () => keys[id] = false);
            });
            
            document.getElementById('attack').addEventListener('touchstart', e => { e.preventDefault(); attack(); }, { passive: false });
            document.getElementById('attack').addEventListener('mousedown', attack);
            
            document.getElementById('energy').addEventListener('touchstart', e => { e.preventDefault(); fireKiBlast(); }, { passive: false });
            document.getElementById('energy').addEventListener('mousedown', fireKiBlast);
            
            document.getElementById('special').addEventListener('touchstart', e => { e.preventDefault(); activateKaioken(); }, { passive: false });
            document.getElementById('special').addEventListener('mousedown', activateKaioken);
            
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft') keys.left = true;
                if (e.key === 'ArrowRight') keys.right = true;
                if (e.key === 'ArrowUp') keys.up = true;
                if (e.key === 'ArrowDown') keys.down = true;
                if (e.key === ' ') attack();
                if (e.key === 'e') fireKiBlast();
                if (e.key === 'q') activateKaioken();
            });
            document.addEventListener('keyup', e => {
                if (e.key === 'ArrowLeft') keys.left = false;
                if (e.key === 'ArrowRight') keys.right = false;
                if (e.key === 'ArrowUp') keys.up = false;
                if (e.key === 'ArrowDown') keys.down = false;
            });
        }
        
        function attack() {
            if (!game.running || game.player.attacking) return;
            game.player.attacking = true;
            game.player.attackTimer = 15;
            
            // Check for enemy hits
            game.enemies.forEach(enemy => {
                const dx = enemy.x - game.player.x;
                const dy = enemy.y - game.player.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 80 && Math.sign(dx) === game.player.facing) {
                    enemy.health -= 20 * game.player.powerLevel;
                    enemy.vx = game.player.facing * 10;
                    createParticles(enemy.x, enemy.y, '#ff9900', 8);
                }
            });
        }
        
        function fireKiBlast() {
            if (!game.running || game.player.energy < 15) return;
            game.player.energy -= 15;
            
            game.projectiles.push({
                x: game.player.x + game.player.facing * 30,
                y: game.player.y,
                vx: game.player.facing * 12,
                vy: 0,
                size: 15,
                damage: 15 * game.player.powerLevel,
                color: game.player.kaioken ? '#ff00ff' : '#00aaff',
                isPlayer: true
            });
        }
        
        function activateKaioken() {
            if (!game.running || game.player.kaioken || game.player.energy < 50) return;
            game.player.kaioken = true;
            game.player.kaiokenTimer = 300;
            game.player.powerLevel = 2;
            game.player.energy -= 50;
        }
        
        function spawnEnemy() {
            const types = [
                { name: 'Frieza Soldier', color: '#aa44aa', health: 30, damage: 10 },
                { name: 'Saiyan', color: '#44aa44', health: 50, damage: 15 },
                { name: 'Android', color: '#4444aa', health: 70, damage: 20 },
                { name: 'Cell Jr', color: '#44aaaa', health: 40, damage: 12 }
            ];
            
            const type = types[Math.floor(Math.random() * Math.min(types.length, game.wave + 1))];
            const side = Math.random() > 0.5 ? 1 : -1;
            
            game.enemies.push({
                x: side > 0 ? width + 50 : -50,
                y: height * GROUND_Y - 60,
                vx: 0,
                vy: 0,
                health: type.health * (1 + game.wave * 0.2),
                maxHealth: type.health * (1 + game.wave * 0.2),
                damage: type.damage,
                color: type.color,
                name: type.name,
                attackCooldown: 0,
                facing: -side
            });
        }
        
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                game.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 30,
                    color,
                    size: Math.random() * 5 + 2
                });
            }
        }
        
        function update() {
            if (!game.running) return;
            
            const p = game.player;
            const groundY = height * GROUND_Y - 60;
            
            // Movement
            if (keys.left) { p.vx = -6; p.facing = -1; }
            else if (keys.right) { p.vx = 6; p.facing = 1; }
            else p.vx *= 0.8;
            
            if (keys.up && p.y >= groundY) p.vy = -12;
            
            // Physics
            p.vy += GRAVITY;
            p.x += p.vx * (p.kaioken ? 1.5 : 1);
            p.y += p.vy;
            
            // Boundaries
            p.x = Math.max(40, Math.min(width - 40, p.x));
            if (p.y > groundY) { p.y = groundY; p.vy = 0; }
            
            // Kaioken timer
            if (p.kaioken) {
                p.kaiokenTimer--;
                if (p.kaiokenTimer <= 0) {
                    p.kaioken = false;
                    p.powerLevel = 1;
                }
            }
            
            // Energy regen
            p.energy = Math.min(p.maxEnergy, p.energy + 0.3);
            
            // Attack timer
            if (p.attackTimer > 0) p.attackTimer--;
            if (p.attackTimer === 0) p.attacking = false;
            
            // Spawn enemies
            game.spawnTimer++;
            const spawnRate = Math.max(60, 150 - game.wave * 15);
            if (game.spawnTimer >= spawnRate && game.enemies.length < 5 + game.wave) {
                spawnEnemy();
                game.spawnTimer = 0;
            }
            
            // Update enemies
            game.enemies.forEach(e => {
                const dx = p.x - e.x;
                e.facing = Math.sign(dx);
                
                if (Math.abs(dx) > 60) {
                    e.vx = e.facing * 2;
                } else {
                    e.vx = 0;
                    // Attack
                    if (e.attackCooldown <= 0) {
                        p.health -= e.damage * 0.5;
                        createParticles(p.x, p.y, '#ff0000', 5);
                        e.attackCooldown = 60;
                    }
                }
                
                if (e.attackCooldown > 0) e.attackCooldown--;
                
                e.x += e.vx;
                e.vx *= 0.9;
            });
            
            // Remove dead enemies
            game.enemies = game.enemies.filter(e => {
                if (e.health <= 0) {
                    game.score += 100;
                    createParticles(e.x, e.y, e.color, 15);
                    return false;
                }
                return true;
            });
            
            // Update projectiles
            game.projectiles.forEach(proj => {
                proj.x += proj.vx;
                proj.y += proj.vy;
            });
            
            // Collision detection
            game.projectiles = game.projectiles.filter(proj => {
                // Off screen
                if (proj.x < -50 || proj.x > width + 50) return false;
                
                // Hit enemies
                if (proj.isPlayer) {
                    for (let e of game.enemies) {
                        const dx = e.x - proj.x;
                        const dy = e.y - proj.y;
                        if (Math.sqrt(dx*dx + dy*dy) < 40) {
                            e.health -= proj.damage;
                            e.vx = Math.sign(proj.vx) * 8;
                            createParticles(proj.x, proj.y, proj.color, 10);
                            return false;
                        }
                    }
                }
                return true;
            });
            
            // Update particles
            game.particles = game.particles.filter(part => {
                part.x += part.vx;
                part.y += part.vy;
                part.vy += 0.3;
                part.life--;
                return part.life > 0;
            });
            
            // Wave progression
            if (game.score >= game.wave * 500) {
                game.wave++;
            }
            
            // Game over
            if (p.health <= 0) {
                gameOver();
            }
            
            // Update HUD
            document.getElementById('healthBar').style.width = (p.health / p.maxHealth * 100) + '%';
            document.getElementById('energyBar').style.width = (p.energy / p.maxEnergy * 100) + '%';
            document.getElementById('score-display').textContent = `SCORE: ${game.score} | WAVE: ${game.wave}`;
        }
        
        function draw() {
            // Background
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#1a0a2e');
            gradient.addColorStop(0.5, '#2d1b4e');
            gradient.addColorStop(1, '#1a0a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137 + Date.now() * 0.01) % width;
                const y = (i * 73) % (height * 0.6);
                ctx.fillRect(x, y, 2, 2);
            }
            
            // Ground
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(0, height * GROUND_Y, width, height * (1 - GROUND_Y));
            
            // Particles
            game.particles.forEach(p => {
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Player
            const p = game.player;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.scale(p.facing, 1);
            
            // Aura
            if (p.kaioken) {
                ctx.fillStyle = 'rgba(255, 0, 100, 0.3)';
                ctx.beginPath();
                ctx.arc(0, 0, 50 + Math.sin(Date.now() * 0.02) * 10, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Body
            ctx.fillStyle = p.kaioken ? '#ff4444' : '#ff8800';
            ctx.fillRect(-15, -30, 30, 50);
            
            // Head
            ctx.fillStyle = '#ffcc99';
            ctx.beginPath();
            ctx.arc(0, -45, 18, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair (spiky)
            ctx.fillStyle = p.kaioken ? '#ff0000' : '#111';
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 6, -60);
                ctx.lineTo(i * 6 - 4, -75 - Math.abs(i) * 5);
                ctx.lineTo(i * 6 + 4, -60);
                ctx.fill();
            }
            
            // Attack arm
            if (p.attacking) {
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(15, -20, 30, 10);
            }
            
            ctx.restore();
            
            // Enemies
            game.enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.scale(e.facing, 1);
                
                // Body
                ctx.fillStyle = e.color;
                ctx.fillRect(-12, -25, 24, 45);
                
                // Head
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.arc(0, -38, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(-8, -42, 5, 5);
                ctx.fillRect(3, -42, 5, 5);
                
                ctx.restore();
            });
            
            // Projectiles
            game.projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.shadowColor = proj.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }
        
        function gameLoop() {
            update();
            draw();
            if (game.running) requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            const groundY = height * GROUND_Y - 60;
            game = {
                running: true,
                score: 0,
                wave: 1,
                player: {
                    x: width / 2,
                    y: groundY,
                    vx: 0, vy: 0,
                    health: 100,
                    maxHealth: 100,
                    energy: 100,
                    maxEnergy: 100,
                    powerLevel: 1,
                    kaioken: false,
                    kaiokenTimer: 0,
                    attacking: false,
                    attackTimer: 0,
                    facing: 1
                },
                enemies: [],
                projectiles: [],
                particles: [],
                spawnTimer: 0
            };
            
            document.getElementById('overlay').classList.add('hidden');
            setupInput();
            gameLoop();
        }
        
        function gameOver() {
            game.running = false;
            const overlay = document.getElementById('overlay');
            overlay.innerHTML = `
                <h1>GAME OVER</h1>
                <h2>Your power faded...</h2>
                <div class="stat-row">
                    <div class="stat">
                        <div class="stat-label">SCORE</div>
                        <div class="stat-value">${game.score}</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">WAVE</div>
                        <div class="stat-value">${game.wave}</div>
                    </div>
                </div>
                <button class="btn" onclick="location.reload()">REMATCH</button>
            `;
            overlay.classList.remove('hidden');
        }
        
        // Initial draw
        draw();
    </script>
</body>
</html>
