<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            z-index: 10;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 20px;
        }
        .game-over h1 {
            font-size: 2.5rem;
            color: #e74c3c;
            margin-bottom: 20px;
        }
        .game-over p {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .hidden { display: none; }
        .instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">❤️❤️❤️</span></div>
    </div>
    
    <canvas id="game"></canvas>
    
    <div class="game-over hidden" id="gameOver">
        <h1>💥 Game Over</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Best: <span id="bestScore">0</span></p>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
    
    <p class="instructions">Tap/Click to shoot • Move ship with mouse/touch</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let ship = { x: width / 2, y: height - 80, width: 40, height: 40 };
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let enemySpeed = 2;
        let spawnRate = 60;
        let frameCount = 0;
        
        // Create stars
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2,
                speed: Math.random() * 2 + 0.5
            });
        }
        
        function drawStars() {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                star.y += star.speed;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
            });
            ctx.globalAlpha = 1;
        }
        
        function drawShip() {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            
            // Ship body
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(-20, 20);
            ctx.lineTo(0, 10);
            ctx.lineTo(20, 20);
            ctx.closePath();
            ctx.fill();
            
            // Cockpit
            ctx.fillStyle = '#87CEEB';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Engine glow
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.moveTo(-10, 20);
            ctx.lineTo(0, 30 + Math.random() * 10);
            ctx.lineTo(10, 20);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        function shoot() {
            bullets.push({
                x: ship.x,
                y: ship.y - 20,
                speed: 10,
                width: 4,
                height: 15
            });
        }
        
        function spawnEnemy() {
            const types = ['🛸', '👾', '👽', '🤖'];
            enemies.push({
                x: Math.random() * (width - 40) + 20,
                y: -40,
                width: 40,
                height: 40,
                emoji: types[Math.floor(Math.random() * types.length)],
                speed: enemySpeed + Math.random()
            });
        }
        
        function createExplosion(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    color: ['#e74c3c', '#f39c12', '#f1c40f', '#fff'][Math.floor(Math.random() * 4)]
                });
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function update() {
            if (!gameRunning) return;
            
            frameCount++;
            
            // Spawn enemies
            if (frameCount % Math.max(20, spawnRate) === 0) {
                spawnEnemy();
            }
            
            // Increase difficulty
            if (frameCount % 500 === 0) {
                enemySpeed += 0.5;
                if (spawnRate > 20) spawnRate -= 5;
            }
            
            // Update bullets
            bullets = bullets.filter(b => b.y > -20);
            bullets.forEach(b => {
                b.y -= b.speed;
                
                ctx.fillStyle = '#00ff00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff00';
                ctx.fillRect(b.x - b.width/2, b.y, b.width, b.height);
                ctx.shadowBlur = 0;
            });
            
            // Update enemies
            enemies = enemies.filter(e => e.y < height + 50);
            enemies.forEach(e => {
                e.y += e.speed;
                
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(e.emoji, e.x, e.y);
            });
            
            // Collision detection
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (Math.abs(b.x - e.x) < 25 && Math.abs(b.y - e.y) < 25) {
                        createExplosion(e.x, e.y);
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                    }
                });
            });
            
            // Enemy hit player
            enemies.forEach((e, ei) => {
                if (Math.abs(e.x - ship.x) < 30 && Math.abs(e.y - ship.y) < 30) {
                    createExplosion(e.x, e.y);
                    enemies.splice(ei, 1);
                    lives--;
                    updateLives();
                    
                    if (lives <= 0) {
                        endGame();
                    }
                }
            });
            
            updateParticles();
        }
        
        function updateLives() {
            document.getElementById('lives').textContent = '❤️'.repeat(lives);
        }
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            drawStars();
            drawShip();
            
            requestAnimationFrame(() => {
                update();
                draw();
            });
        }
        
        function endGame() {
            gameRunning = false;
            document.getElementById('gameOver').classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;
            
            const best = localStorage.getItem('spaceShooter_best') || 0;
            if (score > best) {
                localStorage.setItem('spaceShooter_best', score);
            }
            document.getElementById('bestScore').textContent = Math.max(score, best);
        }
        
        function restartGame() {
            document.getElementById('gameOver').classList.add('hidden');
            ship.x = width / 2;
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            lives = 3;
            enemySpeed = 2;
            spawnRate = 60;
            frameCount = 0;
            gameRunning = true;
            document.getElementById('score').textContent = '0';
            updateLives();
        }
        
        // Controls
        canvas.addEventListener('mousemove', (e) => {
            ship.x = e.clientX;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            ship.x = e.touches[0].clientX;
        });
        
        canvas.addEventListener('click', shoot);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            ship.x = e.touches[0].clientX;
            shoot();
        });
        
        // Auto-shoot
        setInterval(() => {
            if (gameRunning) shoot();
        }, 300);
        
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
        
        draw();
    </script>
</body>
</html>
