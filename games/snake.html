<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 10px;
            color: white;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 1.5rem; }
        #score {
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        #canvas {
            border: 3px solid #4CAF50;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 95vw;
            max-height: 50vh;
        }
        .controls { margin-top: 10px; text-align: center; }
        button {
            padding: 10px 20px;
            font-size: 0.9rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            font-weight: 600;
            margin: 3px;
        }
        button:active { transform: scale(0.95); }
        
        .mobile-controls {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            user-select: none;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }
        .d-pad button {
            width: 60px;
            height: 60px;
            padding: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
        }
        .d-pad .empty { visibility: hidden; }
        a { color: #4CAF50; text-decoration: none; margin-top: 10px; font-size: 0.85rem; }
        
        @media (max-width: 400px) {
            .d-pad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
            .d-pad button { width: 50px; height: 50px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <h1>🐍 Snake</h1>
    <div id="score">Score: 0</div>
    <canvas id="canvas"></canvas>
    
    <div class="mobile-controls">
        <div class="d-pad">
            <button class="empty"></button>
            <button class="up" ontouchstart="setDirection(0,-1)" onclick="setDirection(0,-1)">▲</button>
            <button class="empty"></button>
            <button class="left" ontouchstart="setDirection(-1,0)" onclick="setDirection(-1,0)">◀</button>
            <button class="empty"></button>
            <button class="right" ontouchstart="setDirection(1,0)" onclick="setDirection(1,0)">▶</button>
            <button class="empty"></button>
            <button class="down" ontouchstart="setDirection(0,1)" onclick="setDirection(0,1)">▼</button>
            <button class="empty"></button>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="resetGame()">Restart</button>
    </div>
    <a href="../index.html">← Back</a>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const size = Math.min(window.innerWidth * 0.95, window.innerHeight * 0.5, 400);
        canvas.width = size;
        canvas.height = size;
        
        const gridSize = 20;
        const tileCount = Math.floor(size / gridSize);
        
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let score = 0;
        let gameLoop;
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize-2, gridSize-2);
            
            ctx.fillStyle = '#4CAF50';
            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? '#66BB6A' : '#4CAF50';
                ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize-2, gridSize-2);
            });
        }
        
        function update() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                clearInterval(gameLoop);
                alert('Game Over! Score: ' + score);
                return;
            }
            
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                clearInterval(gameLoop);
                alert('Game Over! Score: ' + score);
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = 'Score: ' + score;
                placeFood();
            } else {
                snake.pop();
            }
            
            draw();
        }
        
        function placeFood() {
            food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
            if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
        }
        
        function setDirection(x, y) {
            if ((x !== 0 && dx === 0) || (y !== 0 && dy === 0)) {
                dx = x; dy = y;
            }
        }
        
        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0; dy = 0;
            score = 0;
            document.getElementById('score').textContent = 'Score: 0';
            placeFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
            draw();
        }
        
        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': setDirection(0, -1); break;
                case 'ArrowDown': setDirection(0, 1); break;
                case 'ArrowLeft': setDirection(-1, 0); break;
                case 'ArrowRight': setDirection(1, 0); break;
            }
        });
        
        resetGame();
    </script>
</body>
</html>
