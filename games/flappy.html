<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - LSI Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #gameContainer {
            position: relative;
            touch-action: none;
        }
        canvas {
            display: block;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
        }
        #overlay.hidden { display: none; }
        #overlay h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffd700;
        }
        #overlay p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #backLink {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
        }
        #highScore {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <a href="../index.html" id="backLink">← Back to Games</a>
    
    <div id="gameContainer">
        <canvas id="game"></canvas>
        <div id="score">0</div>
        <div id="highScore">Best: 0</div>
        <div id="overlay">
            <h1>🐦 Flappy Bird</h1>
            <p>Tap or Press Space to Fly!</p>
            <button class="btn" onclick="startGame()">Play</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');

        // Responsive canvas size
        function resizeCanvas() {
            const maxWidth = Math.min(400, window.innerWidth - 20);
            const maxHeight = Math.min(600, window.innerHeight - 100);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappyHighScore') || '0');
        highScoreDisplay.textContent = `Best: ${highScore}`;

        // Bird
        const bird = {
            x: 50,
            y: 0,
            width: 30,
            height: 24,
            velocity: 0,
            gravity: 0.4,
            jumpStrength: -7,
            
            reset() {
                this.y = canvas.height / 2;
                this.velocity = 0;
            },
            
            jump() {
                this.velocity = this.jumpStrength;
            },
            
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
            },
            
            draw() {
                // Bird body
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.ellipse(this.x + this.width/2, this.y + this.height/2, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Wing
                ctx.fillStyle = '#ffa500';
                const wingY = this.y + this.height/2 + Math.sin(Date.now() / 50) * 3;
                ctx.beginPath();
                ctx.ellipse(this.x + this.width/2 - 5, wingY, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x + this.width - 8, this.y + 8, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + this.width - 6, this.y + 8, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Beak
                ctx.fillStyle = '#ff6b35';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width, this.y + this.height/2);
                ctx.lineTo(this.x + this.width + 10, this.y + this.height/2 + 3);
                ctx.lineTo(this.x + this.width, this.y + this.height/2 + 6);
                ctx.closePath();
                ctx.fill();
            }
        };

        // Pipes
        const pipes = [];
        const pipeWidth = 50;
        const pipeGap = 140;
        let pipeTimer = 0;
        const pipeInterval = 100;

        function createPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function drawPipe(pipe) {
            // Pipe gradient
            const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient.addColorStop(0, '#2ecc71');
            gradient.addColorStop(0.5, '#27ae60');
            gradient.addColorStop(1, '#1e8449');
            
            ctx.fillStyle = gradient;
            
            // Top pipe
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            // Top pipe cap
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
            
            // Bottom pipe
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            // Bottom pipe cap
            ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 20);
            
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(pipe.x + 5, 0, 8, pipe.topHeight - 20);
            ctx.fillRect(pipe.x + 5, pipe.bottomY + 20, 8, canvas.height - pipe.bottomY - 20);
        }

        // Background
        let bgOffset = 0;
        function drawBackground() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#E0F7FA');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            for (let i = 0; i < 5; i++) {
                const cloudX = ((i * 100 + bgOffset * 0.3) % (canvas.width + 60)) - 30;
                const cloudY = 30 + i * 40;
                drawCloud(cloudX, cloudY);
            }
            
            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // Grass
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 25, canvas.width, 10);
        }

        function drawCloud(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.arc(x + 15, y - 5, 18, 0, Math.PI * 2);
            ctx.arc(x + 30, y, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        // Collision detection
        function checkCollision() {
            // Ground and ceiling
            if (bird.y + bird.height > canvas.height - 25 || bird.y < 0) {
                return true;
            }
            
            // Pipes
            for (const pipe of pipes) {
                if (bird.x + bird.width - 5 > pipe.x && bird.x + 5 < pipe.x + pipeWidth) {
                    if (bird.y + 5 < pipe.topHeight || bird.y + bird.height - 5 > pipe.bottomY) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear and draw background
            drawBackground();
            
            // Update bird
            bird.update();
            bird.draw();
            
            // Update pipes
            pipeTimer++;
            if (pipeTimer >= pipeInterval) {
                createPipe();
                pipeTimer = 0;
            }
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2.5;
                drawPipe(pipes[i]);
                
                // Score
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                }
                
                // Remove off-screen pipes
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
            
            // Update background offset
            bgOffset -= 2.5;
            
            // Check collision
            if (checkCollision()) {
                gameOver();
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameRunning = true;
            score = 0;
            scoreDisplay.textContent = '0';
            pipes.length = 0;
            pipeTimer = 80;
            bird.reset();
            overlay.classList.add('hidden');
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore.toString());
                highScoreDisplay.textContent = `Best: ${highScore}`;
            }
            
            overlay.innerHTML = `
                <h1>Game Over!</h1>
                <p>Score: ${score}</p>
                <button class="btn" onclick="startGame()">Play Again</button>
            `;
            overlay.classList.remove('hidden');
        }

        // Controls
        function handleInput() {
            if (gameRunning) {
                bird.jump();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleInput();
            }
        });

        canvas.addEventListener('click', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        });

        // Prevent scrolling on mobile
        document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // Initial draw
        drawBackground();
        bird.reset();
        bird.draw();
    </script>
</body>
</html>
