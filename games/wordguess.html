<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Word Guess</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            user-select: none;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .subtitle {
            opacity: 0.7;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .word-container {
            margin: 30px 0;
        }
        .word-display {
            font-size: 2.5rem;
            letter-spacing: 10px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
        }
        .hint {
            font-size: 1rem;
            opacity: 0.8;
            margin: 10px 0;
        }
        .category {
            background: rgba(52, 152, 219, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .keyboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 400px;
            margin: 20px auto;
        }
        .key {
            width: 36px;
            height: 44px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .key:hover {
            background: rgba(255,255,255,0.3);
        }
        .key.correct {
            background: #2ecc71;
        }
        .key.wrong {
            background: #e74c3c;
            opacity: 0.4;
        }
        .key:disabled {
            cursor: not-allowed;
        }
        .hangman {
            font-size: 3rem;
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .game-over {
            background: rgba(0,0,0,0.8);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .game-over .word {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f1c40f;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Word Guess</h1>
        <p class="subtitle">Guess the word before time runs out!</p>
        
        <div class="stats-bar">
            <div class="stat">Score: <span id="score">0</span></div>
            <div class="stat">Streak: <span id="streak">0</span>🔥</div>
            <div class="stat">Best: <span id="best">0</span></div>
        </div>
        
        <div class="category" id="category">Category: -</div>
        
        <div class="hangman" id="hangman">❤️❤️❤️❤️❤️❤️</div>
        
        <div class="word-container">
            <div class="word-display" id="wordDisplay">_ _ _ _ _</div>
        </div>
        
        <div class="keyboard" id="keyboard"></div>
    </div>
    
    <div class="game-over hidden" id="gameOver">
        <h2 id="gameOverTitle">🎉 You Won!</h2>
        <p class="word">Word: <span id="revealedWord"></span></p>
        <p>Score: <span id="finalScore">0</span></p>
        <button class="btn" onclick="newGame()">Play Again</button>
    </div>

    <script>
        const words = [
            { word: 'PYTHON', category: 'Programming', hint: 'A snake or a language' },
            { word: 'DRAGON', category: 'Fantasy', hint: 'Fire-breathing creature' },
            { word: 'PUZZLE', category: 'Games', hint: 'Brain teaser' },
            { word: 'HONGKONG', category: 'Places', hint: 'Asian city' },
            { word: 'SUSHI', category: 'Food', hint: 'Japanese delicacy' },
            { word: 'ROCKET', category: 'Space', hint: 'Goes to space' },
            { word: 'GUITAR', category: 'Music', hint: 'String instrument' },
            { word: 'PENGUIN', category: 'Animals', hint: 'Antarctic bird' },
            { word: 'CASTLE', category: 'Buildings', hint: 'Royal residence' },
            { word: 'PUMPKIN', category: 'Food', hint: 'Halloween symbol' },
            { word: 'QUANTUM', category: 'Science', hint: 'Physics concept' },
            { word: 'WIZARD', category: 'Fantasy', hint: 'Magic user' },
            { word: 'BICYCLE', category: 'Transport', hint: 'Two wheels' },
            { word: 'VOLCANO', category: 'Nature', hint: 'Erupts lava' },
            { word: 'DIAMOND', category: 'Gems', hint: 'Precious stone' },
            { word: 'ANDROID', category: 'Tech', hint: 'Mobile OS' },
            { word: 'PHOENIX', category: 'Mythology', hint: 'Rises from ashes' },
            { word: 'COFFEE', category: 'Drinks', hint: 'Morning energy' },
            { word: 'GALAXY', category: 'Space', hint: 'Star system' },
            { word: 'GOLF', category: 'Sports', hint: 'Tee time' }
        ];
        
        let currentWord = null;
        let guessedLetters = [];
        let wrongGuesses = 0;
        let score = 0;
        let streak = 0;
        let best = parseInt(localStorage.getItem('wordGuess_best') || '0');
        const maxWrong = 6;
        
        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'key';
                btn.textContent = letter;
                btn.onclick = () => guessLetter(letter, btn);
                keyboard.appendChild(btn);
            });
        }
        
        function newGame() {
            document.getElementById('gameOver').classList.add('hidden');
            currentWord = words[Math.floor(Math.random() * words.length)];
            guessedLetters = [];
            wrongGuesses = 0;
            
            createKeyboard();
            updateDisplay();
            
            document.getElementById('category').textContent = `Category: ${currentWord.category}`;
        }
        
        function guessLetter(letter, btn) {
            if (guessedLetters.includes(letter)) return;
            
            guessedLetters.push(letter);
            
            if (currentWord.word.includes(letter)) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                wrongGuesses++;
            }
            
            btn.disabled = true;
            updateDisplay();
            checkGameEnd();
        }
        
        function updateDisplay() {
            // Word display
            let display = currentWord.word.split('').map(c => 
                guessedLetters.includes(c) ? c : '_'
            ).join(' ');
            document.getElementById('wordDisplay').textContent = display;
            
            // Hangman
            const hearts = '❤️'.repeat(Math.max(0, maxWrong - wrongGuesses));
            const broken = '💔'.repeat(wrongGuesses);
            document.getElementById('hangman').textContent = hearts + broken;
            
            // Stats
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('best').textContent = best;
        }
        
        function checkGameEnd() {
            const won = currentWord.word.split('').every(c => guessedLetters.includes(c));
            const lost = wrongGuesses >= maxWrong;
            
            if (won || lost) {
                setTimeout(() => {
                    document.getElementById('gameOver').classList.remove('hidden');
                    document.getElementById('revealedWord').textContent = currentWord.word;
                    
                    if (won) {
                        const bonus = (maxWrong - wrongGuesses) * 10;
                        const wordScore = currentWord.word.length * 10 + bonus;
                        score += wordScore;
                        streak++;
                        
                        document.getElementById('gameOverTitle').textContent = '🎉 You Won!';
                        document.getElementById('finalScore').textContent = score + ` (+${wordScore})`;
                        
                        if (score > best) {
                            best = score;
                            localStorage.setItem('wordGuess_best', best);
                        }
                    } else {
                        streak = 0;
                        document.getElementById('gameOverTitle').textContent = '😢 Game Over';
                        document.getElementById('finalScore').textContent = score;
                    }
                    
                    updateDisplay();
                }, 500);
            }
        }
        
        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const letter = e.key.toUpperCase();
            if (/^[A-Z]$/.test(letter)) {
                const btn = [...document.querySelectorAll('.key')].find(k => k.textContent === letter);
                if (btn && !btn.disabled) {
                    guessLetter(letter, btn);
                }
            }
        });
        
        document.getElementById('best').textContent = best;
        newGame();
    </script>
</body>
</html>
