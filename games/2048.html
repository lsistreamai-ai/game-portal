<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 10px;
            color: white;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 1.5rem; }
        #score {
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            width: min(90vw, 90vh, 400px);
            aspect-ratio: 1;
        }
        .cell {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 6vw, 2.5rem);
            font-weight: bold;
            transition: all 0.15s;
        }
        .cell[data-value="2"] { background: #eee4da; color: #776e65; }
        .cell[data-value="4"] { background: #ede0c8; color: #776e65; }
        .cell[data-value="8"] { background: #f2b179; color: white; }
        .cell[data-value="16"] { background: #f59563; color: white; }
        .cell[data-value="32"] { background: #f67c5f; color: white; }
        .cell[data-value="64"] { background: #f65e3b; color: white; }
        .cell[data-value="128"] { background: #edcf72; color: white; font-size: clamp(1rem, 5vw, 2rem); }
        .cell[data-value="256"] { background: #edcc61; color: white; font-size: clamp(1rem, 5vw, 2rem); }
        .cell[data-value="512"] { background: #edc850; color: white; font-size: clamp(1rem, 5vw, 2rem); }
        .cell[data-value="1024"] { background: #edc53f; color: white; font-size: clamp(0.9rem, 4vw, 1.5rem); }
        .cell[data-value="2048"] { background: #edc22e; color: white; font-size: clamp(0.9rem, 4vw, 1.5rem); }
        
        .controls { margin-top: 15px; }
        button {
            padding: 10px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            font-weight: 600;
        }
        button:active { transform: scale(0.95); }
        a { color: #f39c12; text-decoration: none; margin-top: 10px; font-size: 0.85rem; }
        .hint { opacity: 0.6; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>2048</h1>
    <div id="score">Score: 0</div>
    <div id="grid"></div>
    <div class="controls">
        <button onclick="resetGame()">New Game</button>
    </div>
    <p class="hint">Swipe to move tiles</p>
    <a href="../index.html">← Back</a>

    <script>
        let grid = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0;
        
        const gridEl = document.getElementById('grid');
        
        function render() {
            gridEl.innerHTML = '';
            grid.flat().forEach(val => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (val) {
                    cell.textContent = val;
                    cell.dataset.value = val;
                }
                gridEl.appendChild(cell);
            });
            document.getElementById('score').textContent = 'Score: ' + score;
        }
        
        function addTile() {
            const empty = [];
            grid.forEach((row, r) => row.forEach((v, c) => !v && empty.push([r, c])));
            if (empty.length) {
                const [r, c] = empty[Math.floor(Math.random() * empty.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function slide(row) {
            let arr = row.filter(v => v);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }
        
        function move(dir) {
            let moved = false;
            const old = JSON.stringify(grid);
            
            if (dir === 'left') grid = grid.map(row => slide(row));
            else if (dir === 'right') grid = grid.map(row => slide(row.reverse()).reverse());
            else if (dir === 'up') {
                let cols = grid[0].map((_, c) => grid.map(r => r[c]));
                cols = cols.map(col => slide(col));
                cols[0].forEach((_, r) => cols.forEach((col, c) => grid[r][c] = col[r]));
            }
            else if (dir === 'down') {
                let cols = grid[0].map((_, c) => grid.map(r => r[c]).reverse());
                cols = cols.map(col => slide(col));
                cols.forEach((col, c) => col.forEach((v, r) => grid[3-r][c] = v));
            }
            
            if (JSON.stringify(grid) !== old) {
                addTile();
                render();
                if (grid.flat().every(v => v) && !canMove()) {
                    setTimeout(() => alert('Game Over! Score: ' + score), 100);
                }
            }
        }
        
        function canMove() {
            for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
                if (!grid[r][c]) return true;
                if (c < 3 && grid[r][c] === grid[r][c+1]) return true;
                if (r < 3 && grid[r][c] === grid[r+1][c]) return true;
            }
            return false;
        }
        
        function resetGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            addTile();
            addTile();
            render();
        }
        
        document.addEventListener('keydown', e => {
            if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
                e.preventDefault();
                move(e.key.replace('Arrow', '').toLowerCase());
            }
        });
        
        let startX, startY;
        document.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', e => {
            if (!startX || !startY) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                move(dx > 0 ? 'right' : 'left');
            } else if (Math.abs(dy) > 30) {
                move(dy > 0 ? 'down' : 'up');
            }
            startX = startY = null;
        });
        
        resetGame();
    </script>
</body>
</html>
