<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simon Says</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            user-select: none;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .score {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .game-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .quarter {
            position: absolute;
            width: 140px;
            height: 140px;
            cursor: pointer;
            transition: all 0.1s;
            border: 3px solid #2d2d44;
        }
        .quarter.active {
            filter: brightness(1.5);
            transform: scale(1.05);
        }
        .quarter.player-active {
            filter: brightness(1.3);
        }
        .green { 
            background: #2ecc71; 
            top: 0; 
            left: 0; 
            border-radius: 150px 0 0 0;
        }
        .red { 
            background: #e74c3c; 
            top: 0; 
            right: 0; 
            border-radius: 0 150px 0 0;
        }
        .yellow { 
            background: #f1c40f; 
            bottom: 0; 
            left: 0; 
            border-radius: 0 0 0 150px;
        }
        .blue { 
            background: #3498db; 
            bottom: 0; 
            right: 0; 
            border-radius: 0 0 150px 0;
        }
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 10;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            font-size: 1.2rem;
            margin: 20px 0;
            min-height: 30px;
        }
        .hidden { display: none; }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .stat {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🎮 Simon Says</h1>
    
    <div class="score">Level: <span id="level">0</span></div>
    
    <div class="game-container">
        <div class="quarter green" data-color="green"></div>
        <div class="quarter red" data-color="red"></div>
        <div class="quarter yellow" data-color="yellow"></div>
        <div class="quarter blue" data-color="blue"></div>
        <div class="center">▶️</div>
    </div>
    
    <p class="message" id="message">Press Start to Play!</p>
    
    <button class="btn" id="startBtn" onclick="startGame()">Start</button>
    
    <div class="stats">
        <div class="stat">Best: <span id="best">0</span></div>
    </div>

    <script>
        const quarters = document.querySelectorAll('.quarter');
        const colors = ['green', 'red', 'yellow', 'blue'];
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let canPlay = false;
        let best = parseInt(localStorage.getItem('simon_best') || '0');
        
        document.getElementById('best').textContent = best;
        
        const sounds = {
            green: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'),
            red: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'),
            yellow: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'),
            blue: new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU')
        };
        
        function playSound(color) {
            // Create oscillator for sound
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                const freqs = { green: 392, red: 329.6, yellow: 261.6, blue: 220 };
                osc.frequency.value = freqs[color];
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }
        
        function flash(color) {
            return new Promise(resolve => {
                const quarter = document.querySelector(`.${color}`);
                quarter.classList.add('active');
                playSound(color);
                
                setTimeout(() => {
                    quarter.classList.remove('active');
                    setTimeout(resolve, 100);
                }, 400);
            });
        }
        
        async function playSequence() {
            canPlay = false;
            setMessage('Watch carefully...');
            
            await new Promise(r => setTimeout(r, 500));
            
            for (const color of sequence) {
                await flash(color);
            }
            
            canPlay = true;
            playerSequence = [];
            setMessage('Your turn!');
        }
        
        async function handlePlayerInput(color) {
            if (!canPlay) return;
            
            const quarter = document.querySelector(`.${color}`);
            quarter.classList.add('player-active');
            playSound(color);
            
            setTimeout(() => {
                quarter.classList.remove('player-active');
            }, 200);
            
            playerSequence.push(color);
            
            // Check if correct
            const currentIndex = playerSequence.length - 1;
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                // Wrong!
                gameOver();
                return;
            }
            
            // Check if sequence complete
            if (playerSequence.length === sequence.length) {
                canPlay = false;
                level++;
                document.getElementById('level').textContent = level;
                setMessage('✅ Correct!');
                
                await new Promise(r => setTimeout(r, 1000));
                
                addToSequence();
                playSequence();
            }
        }
        
        function addToSequence() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);
        }
        
        async function startGame() {
            sequence = [];
            playerSequence = [];
            level = 0;
            document.getElementById('level').textContent = level;
            document.getElementById('startBtn').classList.add('hidden');
            
            addToSequence();
            await playSequence();
        }
        
        function gameOver() {
            canPlay = false;
            setMessage('❌ Wrong! Game Over');
            
            // Flash all red
            quarters.forEach(q => {
                q.style.background = '#e74c3c';
            });
            
            setTimeout(() => {
                quarters.forEach(q => {
                    const color = q.dataset.color;
                    const colorMap = { green: '#2ecc71', red: '#e74c3c', yellow: '#f1c40f', blue: '#3498db' };
                    q.style.background = colorMap[color];
                });
            }, 500);
            
            if (level > best) {
                best = level;
                localStorage.setItem('simon_best', best);
                document.getElementById('best').textContent = best;
                setMessage(`🎉 New Best: ${best}!`);
            }
            
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('startBtn').textContent = 'Play Again';
        }
        
        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }
        
        // Event listeners
        quarters.forEach(quarter => {
            quarter.addEventListener('click', () => {
                handlePlayerInput(quarter.dataset.color);
            });
            quarter.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handlePlayerInput(quarter.dataset.color);
            });
        });
    </script>
</body>
</html>
